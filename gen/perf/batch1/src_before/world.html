  <link rel="stylesheet" href="/assets/ui/fonts/fonts.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e9dcc0; font-family: system-ui, sans-serif; }
    canvas { display: block; touch-action: none; }
    #help { position: fixed; left: 12px; bottom: 12px; padding: 8px 10px; background: rgba(40, 28, 18, 0.55);
            color: #f4ead6; font-size: 12px; line-height: 1.5; border-radius: 6px; pointer-events: none; max-width: 70vw; }
    #stats { position: fixed; left: 12px; top: 12px; padding: 4px 8px; background: rgba(40, 28, 18, 0.55);
             color: #f4ead6; font: 11px ui-monospace, monospace; border-radius: 4px; pointer-events: none; white-space: pre; }
    #ref { position: fixed; top: 0; left: 50%; height: 100vh; transform: translateX(-50%); pointer-events: none; display: none; }
    /* the loading/title screen (ink UI, gen/ui/STYLE.md): paper, mist, the title and seal, progress as one ink stroke;
       web/src/ui/loading.js drives --ld and the wipe-out; inline so it paints before any script. The rules are keyed on
       the class .ld, never the id: done() takes the id away at once (for the tools), and rules on #loading then let the
       logo paint at its own huge size until the paper went (the round-2 "stuck at huge text", gen/ui/r2_time.md). The
       wipe is two opposite transforms (the box slides left, its content right), which the compositor runs smoothly
       while the main thread is busy streaming in the neighbouring sections. */
    .ld { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; overflow: hidden;
          color: #2a2420; font: 16px/1.4 "QM Text", "BiauKai", "DFKai-SB", "Kaiti TC", "STKaiti", "KaiTi", serif;
          background: #efe4cc; --ld: 0; }
    .ld-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh; }
    .ld .ld-paper { position: absolute; inset: 0; z-index: -2; background: radial-gradient(120% 90% at 50% 45%, #f5ecd8 0%, #efe4cc 55%, #e0d0ad 100%); }
    .ld .ld-mist { position: absolute; inset: 0; z-index: -1; background: radial-gradient(38% 26% at 26% 30%, rgba(255, 252, 244, 0.75), transparent 70%),
               radial-gradient(34% 24% at 76% 68%, rgba(255, 252, 244, 0.6), transparent 70%), radial-gradient(22% 14% at 70% 22%, rgba(255, 252, 244, 0.5), transparent 70%); }
    .ld .ld-mark { display: flex; flex-direction: row-reverse; align-items: flex-end; gap: 12px; }
    .ld .ld-logo { display: block; height: clamp(220px, 46vh, 430px); width: auto; } /* Huizong's 瘦金 清明上河圖 with its seal (assets/ui/logo_v.svg, gen/ui/fonts/CHOICE.md) */
    .ld .ld-stroke { position: relative; width: min(440px, 70vw); aspect-ratio: 600 / 36; }
    .ld .ld-stroke svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .ld .ld-ghost { opacity: 0.1; }
    .ld .ld-ink { clip-path: inset(0 calc(100% - var(--ld) * 100%) 0 0); transition: clip-path 0.6s ease; }
    .ld:not(.ld-js) .ld-ink { animation: ld-pre 9s cubic-bezier(0.2, 0.6, 0.3, 1) forwards; }
    .ld .ld-hint { margin: 0; font-size: 15px; letter-spacing: 0.6em; text-indent: 0.6em; opacity: 0.55; }
    .ld.ld-out { pointer-events: none; animation: ld-wipe 1.1s cubic-bezier(0.6, 0, 0.3, 1) forwards; }
    .ld.ld-out > .ld-in { animation: ld-wipe-in 1.1s cubic-bezier(0.6, 0, 0.3, 1) forwards; }
    @keyframes ld-pre { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 72% 0 0); } }
    @keyframes ld-wipe { to { transform: translateX(-100%); } }
    @keyframes ld-wipe-in { to { transform: translateX(100%); } }
    @keyframes ld-fade { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ld.ld-out { animation: ld-fade 0.3s forwards; } .ld.ld-out > .ld-in { animation: none; } .ld .ld-ink { transition: none; } }
    /* the sundial (src/sundial.js): the time of day, read as the scroll's people read it */
    .sundial { position: fixed; left: 14px; top: 42px; width: 104px; height: 104px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35)); }
    .sundial svg { display: block; width: 100%; height: 100%; }
    @media (max-width: 640px) { .sundial { width: 76px; height: 76px; top: 38px; left: 10px; } }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 2px;
                 background: rgba(58, 38, 23, 0.6); pointer-events: none; display: none; }
  </style>
