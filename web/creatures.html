<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Creature Lineup</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e9dcc0; font-family: system-ui, sans-serif; }
    canvas { display: block; touch-action: none; }
    #help { position: fixed; left: 12px; bottom: 12px; padding: 8px 10px; background: rgba(40, 28, 18, 0.55);
            color: #f4ead6; font-size: 12px; line-height: 1.5; border-radius: 6px; pointer-events: none; max-width: 70vw; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
               color: #3a2617; font-size: 15px; background: #e9dcc0; }
  </style>
</head>
<body>
  <div id="loading">Loading the animals…</div>
  <div id="help"></div>
  <script type="module" src="/src/creatures.js"></script>
</body>
</html>
