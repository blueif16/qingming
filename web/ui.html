<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>清明上河圖 · UI kit</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/assets/ui/fonts/fonts.css" />
  <style>
    html, body { margin: 0; }
    body.gallery { background: #d9cdb3; font: 14px/1.4 "Iowan Old Style", Palatino, Georgia, serif; color: #2a2420; padding: 18px; }
    body.gallery h1 { font: 400 26px/1.2 "Kaiti TC", "KaiTi", serif; letter-spacing: 0.12em; margin: 0 0 4px; }
    body.gallery p { margin: 0 0 14px; max-width: 900px; }
    .row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; margin-bottom: 26px; }
    .row h2 { width: 100%; margin: 0; font: 400 19px/1.2 "Kaiti TC", "KaiTi", serif; letter-spacing: 0.1em; }
    figure { margin: 0; }
    figcaption { font-size: 12px; opacity: 0.7; margin-top: 4px; }
    .box { overflow: hidden; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); background: #000; }
    .box iframe { border: 0; transform-origin: 0 0; display: block; }
    body.frame { overflow: hidden; height: 100vh; background: #efe4cc; }
    body.frame .still { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <script type="module" src="/src/ui/kit.js"></script>
</body>
</html>
